name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@571cc734cd69fb846032ec77a662aa8ee4fc32cd
    # Reusable called-workflow permissions are CAPPED by the caller's grants;
    # without security-events: write here the scorecard SARIF upload fails with
    # startup_failure (hypatia WF018). id-token: write enables OIDC publish.
    # actions: read matches the reusable's TOP-LEVEL permissions block at the
    # pinned SHA — a caller granting less than the reusable declares is a
    # 0-second startup_failure before any job runs (standards'
    # rust-ci-reusable.yml documents the same trap in reverse).
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
