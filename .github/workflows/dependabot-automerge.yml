# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
#
# dependabot-automerge.yml — request GitHub-native auto-merge for PRs
# authored by Dependabot. Repository owner policy makes every patch, minor,
# major, security, and routine update eligible; native auto-merge still waits
# for required checks and branch-protection rules. This workflow grants no
# ruleset bypass.
#
# The update type and advisory metadata come from dependabot/fetch-metadata,
# never free-text parsing. Eligibility is intentionally permissive, so a green
# test run is not a proof that an upstream package is benign; this is an
# accepted supply-chain risk in exchange for update velocity.
#
# The job permission block grants write access only to the auto-merge job. It
# is scoped to PRs whose recorded author is Dependabot, per repository policy.

name: Dependabot Auto-Merge
on:
  pull_request:
    types: [opened, reopened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write # needed to approve
  # NB: keep narrow — do NOT add secrets: read or id-token: write here.
  # The write scope auto-merge needs is elevated PER JOB below, not here: a
  # job-level permissions: block REPLACES this one, so the job restates both.
jobs:
  automerge:
    # Only run for PRs actually authored by Dependabot.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # needed to enable auto-merge (gh pr merge --auto)
      pull-requests: write # needed to approve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # --- Policy gate -------------------------------------------------------
      # Outputs from fetch-metadata we care about:
      #   update-type      → version-update:semver-{patch,minor,major}
      #   dependency-type  → direct:{development,production} | indirect
      #   alert-state      → AUTO_DISMISSED | DISMISSED | FIXED | OPEN
      #   ghsa-id          → GHSA-... if this is a security PR
      # --- Policy -------------------------------------------------------------
      # Owner policy makes every Dependabot update eligible. These metadata
      # outputs are recorded for audit and do not narrow eligibility.
      - name: Decide policy outcome
        id: policy
        env:
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail

          is_security=false
          [ -n "$GHSA_ID" ] && is_security=true

          # Every update type is eligible. GitHub's native auto-merge remains
          # subject to whichever required checks and rules branch protection
          # currently enforces; Dependabot is not granted a ruleset bypass.
          echo "action=automerge" >> "$GITHUB_OUTPUT"
          echo "security=$is_security" >> "$GITHUB_OUTPUT"
          echo "update_type=$UPDATE_TYPE" >> "$GITHUB_OUTPUT"
          echo "ghsa=$GHSA_ID" >> "$GITHUB_OUTPUT"
      - name: Approve PR (if policy allows)
        if: steps.policy.outputs.action == 'automerge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approving Dependabot update (type=${{ steps.policy.outputs.update_type }}, GHSA=${{ steps.policy.outputs.ghsa }}). Repository policy makes all update types eligible for native auto-merge, subject to required branch-protection checks."
      - name: Enable auto-merge (if policy allows)
        if: steps.policy.outputs.action == 'automerge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
      - name: Write decision to step summary
        env:
          ACTION: ${{ steps.policy.outputs.action }}
          IS_SECURITY: ${{ steps.policy.outputs.security }}
          UPDATE_TYPE: ${{ steps.policy.outputs.update_type }}
          GHSA: ${{ steps.policy.outputs.ghsa }}
        run: |
          {
            echo "## Dependabot Auto-Merge Decision"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Policy action | \`$ACTION\` |"
            echo "| Security update | \`$IS_SECURITY\` |"
            echo "| Update type | \`$UPDATE_TYPE\` |"
            echo "| GHSA ID | \`${GHSA:-n/a}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
