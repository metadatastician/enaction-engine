# SPDX-License-Identifier: AGPL-3.0-or-later
name: OikosBot Sustainability Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  oikosbot:
    name: Sustainability Analysis
    # GATED OFF until the analyser container actually exists.
    #
    # This job pulls ghcr.io/hyperpolymath/oikos:v2.0.0, which has never been
    # published: hyperpolymath/oikosbot has no container-publishing workflow
    # and its only tag is v0.1.0, so the pull fails "manifest unknown" on
    # every run. A gate that cannot pass is not a gate — it is a red light
    # people learn to ignore, which is worse than no light.
    #
    # The workflow is kept rather than deleted because the intent is real and
    # the repo declares .oikos.yml. To enable, set the repository variable
    # OIKOSBOT_ENABLED to 'true' once the image is published — and check the
    # image NAME as well as the tag while doing it: the analyser repo is
    # `oikosbot`, but this pulls `oikos`, which is the economics DSL.
    if: vars.OIKOSBOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # OikosBot's own composite action runs the published CLI container.
      # It replaces the former hand-rolled job, which could never work:
      # it pinned ghcr.io/hyperpolymath/oikos:v2.0.0 (a tag that has never
      # existed on the package) as a `container:` image, and masked the
      # resulting failure with `|| echo`. Config comes from .oikos.yml.
      - name: Run OikosBot analysis
        uses: hyperpolymath/oikosbot@bb95ab5063ab9b43a948e21ed8b3fe35b1d1768b  # v0.1.0
        with:
          mode: report
          path: .
          output: results.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3 — verified pin; 39a73d6 is not a commit in github/codeql-action
        with:
          sarif_file: results.sarif
          category: oikosbot
