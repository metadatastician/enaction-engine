# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
name: OikosBot Sustainability Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  oikosbot:
    name: Sustainability Analysis
    # Runs the published composite action (hyperpolymath/oikosbot@v0.1.0).
    # This repo is the proven pilot: 101 SARIF results ingested on PR #21.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # OikosBot's own composite action runs the published CLI container.
      # It replaces the former hand-rolled job, which could never work:
      # it pinned ghcr.io/hyperpolymath/oikos:v2.0.0 (a tag that has never
      # existed on the package) as a `container:` image, and masked the
      # resulting failure with `|| echo`. Config comes from .oikos.yml.
      - name: Run OikosBot analysis
        uses: hyperpolymath/oikosbot@v0.1.0
        with:
          mode: report
          path: .
          output: results.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: results.sarif
          category: oikosbot
