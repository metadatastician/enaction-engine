# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Security Policy
on:
  push:
    branches: [main, master]
  pull_request:

# Estate guardrail: scope push to default branches so a PR fires once (not
# push+PR), and cancel superseded runs. Safe — read-only PR-triggered check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Security checks
        shell: bash
        run: |
          set -euo pipefail

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          FAILED=0

          scan_pattern() {
            local label="$1"
            local pattern="$2"
            shift 2

            if grep -riEn --binary-files=without-match \
                --exclude-dir=.git --exclude-dir=target --exclude-dir=build \
                --exclude-dir=dist --exclude-dir=node_modules \
                --exclude-dir=tests --exclude-dir=test --exclude-dir=spec \
                --exclude-dir=examples \
                "$@" -- "$pattern" . >"$TEMP_DIR/matches" 2>"$TEMP_DIR/errors"; then
              echo "ERROR: $label detected:"
              cat "$TEMP_DIR/matches"
              FAILED=1
            else
              local status=$?
              if [ "$status" -eq 1 ]; then
                echo "PASS: no $label detected"
              else
                echo "ERROR: $label scan failed (grep exit $status):" >&2
                cat "$TEMP_DIR/errors" >&2
                FAILED=1
              fi
            fi
          }

          SOURCE_GLOBS=(
            --include='*.py' --include='*.rb' --include='*.js'
            --include='*.ts' --include='*.go' --include='*.rs'
            --include='*.zig'
          )

          # Search implementation source, not policy prose or test examples.
          scan_pattern "weak MD5/SHA-1 calls" 'md5\(|sha1\(' "${SOURCE_GLOBS[@]}"
          scan_pattern "plain-HTTP URLs in source" 'http://[^[:space:]]+' "${SOURCE_GLOBS[@]}"
          scan_pattern "hard-coded credential literals" "(api_key|apikey|secret_key|pass[[:alpha:]]{4})[[:space:]]*[=:][[:space:]]*['\"][A-Za-z0-9+/=]{20,}" \
            "${SOURCE_GLOBS[@]}" --include='*.env'

          if [ "$FAILED" -ne 0 ]; then
            echo "Security policy checks failed" >&2
            exit 1
          fi

          echo "Security policy checks passed"
