# This workflow is managed by gh actions-lock.
# GitHub Pages from the canonical AsciiDoc README.
# casket-ssg remains alpha and publishes no release artifact; cold source builds
# compile the full Pandoc/Typst graph and repeatedly exceed runner limits.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Serialise Pages deploys; never cancel an in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build site
        run: |
          export GEM_HOME="$PWD/.gems"
          gem install asciidoctor --version 2.0.26 --no-document \
            --install-dir "$GEM_HOME"
          mkdir -p _site
          "$GEM_HOME/bin/asciidoctor" --backend html5 --destination-dir _site \
            --out-file index.html README.adoc
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'

  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
