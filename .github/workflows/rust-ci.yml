# This workflow is managed by gh actions-lock.
# Rust CI — explicit repository checks plus the Zig-linked accelerator seam.
# Keeping these steps local avoids an opaque startup failure in GitHub's
# reusable-workflow loader while preserving every previously intended gate.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  rust-ci:
    name: Check, format, clippy, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cargo check
        run: cargo check --locked --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
  # enaction-accelerator-native links a Zig-built static library. The shared
  # Rust leg has no Zig toolchain, so the crate sits outside the workspace
  # default-members (Cargo.toml) and gets its own visible, failable leg here
  # — the estate doctrine forbids silent skips. Zig pin matches mise.toml /
  # .tool-versions (0.16.0: build.zig uses the 0.15+ addLibrary API and the
  # committed artefacts were built with 0.16.0).
  accelerator:
    name: Accelerator (Zig-linked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        # Explicit install rather than the runner's preinstalled Rust, so this
        # leg uses the SAME toolchain as the main Rust job (dtolnay + explicit
        # `toolchain: stable`) — otherwise clippy -D warnings could drift
        # between runner-image stable and the reusable's stable. The repo's CI
        # truth is stable (the reusable pins it); .tool-versions' nightly is
        # the local mise toolchain only. gh actions-lock normalizes dtolnay to
        # @master and pins the resolved commit in actions.lock.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Install pinned Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Zig unit tests (FFI seam)
        working-directory: src/interface/ffi
        run: zig build test
      - name: Native accelerator — check, clippy, test
        run: |
          cargo check --locked -p enaction-accelerator-native --all-targets
          cargo clippy --locked -p enaction-accelerator-native --all-targets -- -D warnings
          cargo test --locked -p enaction-accelerator-native --all-targets
