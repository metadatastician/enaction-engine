# The Enaction Engine Cargo workspace.
#
# Crates are extracted from proving grounds, not designed in the abstract.
# `enaction-time` generalises fixed-timestep interpolation built and proven in
# metadatastician/IDApTIK (`crates/idaptik-core/src/interp.rs`); see
# docs/decisions/0005-fixed-timestep-and-interpolation.adoc for the extraction
# boundary and why the engine also needs an accumulator IDApTIK does not.
[workspace]
resolver = "2"
members = [
    "crates/enaction-time",
    "crates/enaction-trace",
    "crates/enaction-contracts",
    "crates/enaction-accelerator",
    "crates/enaction-accelerator-native",
    "verification/creusot",
]
# enaction-accelerator-native links a Zig-built static library (see
# crates/enaction-accelerator-native/build.rs). It stays a workspace member
# and stays in Cargo.lock, but leaves the DEFAULT build set because the
# shared Rust CI reusable has no toolchain hook and cannot install Zig.
# It is NOT skipped: the `accelerator` job in .github/workflows/rust-ci.yml
# installs the pinned Zig and builds, lints, and tests it explicitly.
# Revert this once the reusable grows a setup_zig input.
default-members = [
    "crates/enaction-time",
    "crates/enaction-trace",
    "crates/enaction-contracts",
    "crates/enaction-accelerator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Enaction Engine contributors"]
repository = "https://github.com/metadatastician/enaction-engine"

[workspace.dependencies]
enaction-time = { path = "crates/enaction-time" }
enaction-trace = { path = "crates/enaction-trace" }
enaction-contracts = { path = "crates/enaction-contracts" }
enaction-accelerator = { path = "crates/enaction-accelerator" }
enaction-accelerator-native = { path = "crates/enaction-accelerator-native" }
creusot-std = "=0.13.0"
serde = { version = "1", features = ["derive"] }
