# The Affective Engine Cargo workspace.
#
# Crates are extracted from proving grounds, not designed in the abstract.
# `affective-time` generalises the fixed-timestep interpolation first built and
# proven in metadatastician/IDApTIK (`crates/idaptik-core/src/interp.rs`); see
# docs/adr/0002-fixed-timestep-and-interpolation.md for what changed on the way
# out and why the engine needs an accumulator IDApTIK does not.
[workspace]
resolver = "2"
members = ["crates/affective-time"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Affective Engine contributors"]
repository = "https://github.com/metadatastician/affective-engine"

[workspace.dependencies]
affective-time = { path = "crates/affective-time" }
