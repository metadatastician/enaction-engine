# The Enaction Engine Cargo workspace.
#
# Crates are extracted from proving grounds, not designed in the abstract.
# `enaction-time` generalises fixed-timestep interpolation built and proven in
# metadatastician/IDApTIK (`crates/idaptik-core/src/interp.rs`); see
# docs/decisions/0005-fixed-timestep-and-interpolation.adoc for the extraction
# boundary and why the engine also needs an accumulator IDApTIK does not.
[workspace]
resolver = "2"
members = ["crates/affective-time", "crates/enaction-cognition"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Enaction Engine contributors"]
repository = "https://github.com/metadatastician/enaction-engine"

[workspace.dependencies]
affective-time = { path = "crates/affective-time" }
enaction-cognition = { path = "crates/enaction-cognition" }
serde = { version = "1", features = ["derive"] }
