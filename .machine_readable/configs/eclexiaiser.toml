# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: AGPL-3.0-or-later

[project]
name = "enaction-engine"

[[functions]]
name = "build"
source = "src/interface/ffi/build.zig"
energy-budget-mj = 15.0
carbon-budget-mg = 3.0

[[functions]]
name = "enaction_accel_execute_f32_binary"
source = "src/interface/ffi/src/accelerator.zig"
energy-budget-mj = 5.0
carbon-budget-mg = 1.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
