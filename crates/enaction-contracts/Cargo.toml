# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "enaction-contracts"
description = "The estate's ESM/CAC contract as types: versioning, bounded confidence policy, provenance and package validation."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
creusot-std.workspace = true
serde.workspace = true
enaction-trace.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[dev-dependencies]
# Test-only: serde round-trips and the proofs that invalid values cannot
# deserialize. Creusot's proof annotations are a normal dependency so the
# checked contract stays on the production function.
serde_json = "1"
