# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Cerro Torre manifest for Affective Engine .ctp bundle
#
# This manifest describes the container image for verified
# container packaging. Used by `ct pack` to create .ctp bundles.

[metadata]
name = "affective-engine"
version = "0.1.0"
revision = 1
summary = "A game engine: deterministic fixed-timestep simulation with render interpolation."
description = """
Affective Engine — containerised service packaged as a verified
cerro-torre .ctp bundle with Ed25519 signing and full provenance
tracking.
"""
license = "AGPL-3.0-or-later"
homepage = "https://github.com/metadatastician/affective-engine"
maintainer = "Jonathan D.A. Jewell <jonathan.jewell@gmail.com>"

[provenance]
upstream = "https://github.com/metadatastician/affective-engine"
import_date = 2026-07-22T00:00:00Z

[dependencies]
runtime = ["ca-certificates", "curl"]
build = []

[build]
system = "podman"

[build.environment]
APP_HOST = "[::]"
APP_PORT = "8080"

[outputs]
primary = "affective-engine"
split = []

[attestations]
require = ["source-signature", "sbom-complete"]
recommend = ["security-audit", "reproducible-build"]

# Runtime security profile
[security]
user = "appuser"
group = "appuser"
read_only_root = false
no_new_privileges = true

[security.capabilities]
drop = ["ALL"]
add = ["NET_BIND_SERVICE"]

[security.network]
listen_tcp = [8080]

[security.filesystem]
read = ["/app/", "/data/"]
write = ["/data/", "/tmp/"]
execute = ["/app/entrypoint.sh"]
