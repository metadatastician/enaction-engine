# SonarQube Cloud (SonarCloud) configuration.
#
# ORG IS ASSUMED, NOT VERIFIED -- maintainer to confirm before provisioning.
# Reasoning: this is a metadatastician-org GitHub repo, and IDApTIK (also
# metadatastician-org) records the same assumption. But the "metadatastician"
# SonarCloud org may not exist, while "hyperpolymath" is what most of the
# estate uses. If the estate consolidates under the hyperpolymath SonarCloud
# org, this should read hyperpolymath / hyperpolymath_affective-engine.
#
# `just init` left this reading "hyperpolymath" despite being told the owner is
# metadatastician -- the template's owner literal was never substituted. Fixed
# upstream in rsr-template-repo PR #6; corrected by hand here.
# Project: https://sonarcloud.io/project/overview?id=metadatastician_affective-engine
# Requires the SONAR_TOKEN repository secret + a SonarCloud project (owner setup).
sonar.organization=metadatastician
sonar.projectKey=metadatastician_affective-engine

# Analysable surface = shell scripts + any JS/TS the template carries. Idris2,
# Zig, Elixir and AffineScript have no SonarCloud analyser; vendored, generated,
# build, proof, doc-template and dependency trees are excluded to keep findings
# signal-rich (mirrors the boj-server arrangement).
sonar.exclusions=LICENSE,LICENSES/**,docs/legal/**,build/**,container/**,generated/**,**/node_modules/**,**/_build/**,**/deps/**,**/.lake/**,verification/**,docs-template/**,machine-readable-design/**,**/*.idr,**/*.ipkg,**/*.zig
sonar.coverage.exclusions=tests/**,**/*test*
